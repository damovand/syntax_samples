
<!DOCTYPE html>
<html>
<head>
    <title>DataFrame Table</title>
    <style>
        table { border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>DataFrame Display{% if category %} - Filtered by Category "{{ category }}"{% endif %}</h2>

    <form method="get" action="/">
        <label for="category">Filter by Category:</label>
        <input type="text" name="category" id="category" placeholder="A, B, C">
        <button type="submit">Filter</button>
    </form>

    <table>
        <thead>
            <tr>
                {% for col in columns %}
                    <th>{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    {% for col in columns %}
                        <td>{{ row[col] }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
